<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลอยกระทงออนไลน์</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:linear-gradient(to bottom,#070b19,#111d3a 55%,#081226);color:#fff;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
body.bg-fw{background:linear-gradient(to bottom,#12071f,#2b1042 55%,#140824)}
body.bg-fr{background:linear-gradient(to bottom,#031412,#092b26 55%,#041714)}
.top{position:fixed;top:12px;left:0;width:100%;padding:0 12px;z-index:30;display:flex;justify-content:space-between;gap:6px}
.pbtn{background:#0f1a34;border:1px solid #ffd700;color:#ffd700;padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.sws{display:flex;gap:4px;background:#0f1a34;border:1px solid #ffd700;padding:3px;border-radius:20px}
.bgo{background:none;border:none;color:#ccc;padding:4px 8px;border-radius:15px;font-size:12px;cursor:pointer}
.bgo.on{background:#ffd700;color:#000;font-weight:bold}
.sky{position:fixed;top:0;left:0;width:100%;height:62vh;pointer-events:none;z-index:1;overflow:hidden}
.moon{position:absolute;top:55px;right:10%;width:65px;height:65px;background:#fff8d6;border-radius:50%;box-shadow:0 0 30px #ffea85}
.lnt{position:absolute;width:14px;height:18px;background:radial-gradient(circle,#fff59d 10%,#ff9800 90%);border-radius:4px;box-shadow:0 0 12px #ff9800;animation:up linear infinite}
@keyframes up{0%{transform:translateY(80px) scale(0.8);opacity:0}20%{opacity:0.9}100%{transform:translateY(-420px) scale(0.4);opacity:0}}
.fwk{position:absolute;width:6px;height:6px;border-radius:50%;animation:bm 1.8s ease-out infinite}
@keyframes bm{0%{transform:scale(0.1);opacity:1}100%{transform:scale(1);opacity:0;box-shadow:0 -38px 0 #ff4081,32px -18px 0 #ffd700,32px 18px 0 #00e5ff,0 38px 0 #76ff03,-32px 18px 0 #e040fb,-32px -18px 0 #ff9100}}
.fly{position:absolute;width:5px;height:5px;background:#aeea00;border-radius:50%;box-shadow:0 0 10px #aeea00;animation:bk 3s ease-in-out infinite alternate}
@keyframes bk{0%{opacity:0.1;transform:translate(0,0)}100%{opacity:1;transform:translate(15px,-15px)}}
.river{position:fixed;bottom:0;left:0;width:100%;height:38vh;background:#061124;border-top:2px solid rgba(255,215,0,0.3);z-index:2;overflow:hidden}
.box{position:relative;z-index:20;background:rgba(15,26,52,0.92);border:1px solid #ffd700;border-radius:16px;padding:15px;margin-top:60px;width:92%;max-width:400px;text-align:center}
h1{font-size:18px;color:#ffd700;margin-bottom:4px}
.status{font-size:11px;color:#81c784;margin-bottom:6px}
.prev{background:rgba(0,0,0,0.35);border:1px dashed #ffd700;border-radius:12px;padding:6px;margin:6px 0;min-height:95px;display:flex;justify-content:center;align-items:center}
.lbl{font-size:12px;color:#cbd5e1;text-align:left;margin:6px 0 3px;display:block}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.bb{flex:1;padding:6px;font-size:12px;background:rgba(255,255,255,0.1);border:1px solid transparent;border-radius:8px;color:#fff;cursor:pointer}
.bb.on{border-color:#ffd700;color:#ffd700;background:rgba(255,215,0,0.2)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);cursor:pointer}
.dot.on{border-color:#ffd700;transform:scale(1.15)}
input{width:100%;padding:8px;margin-bottom:8px;border-radius:8px;border:1px solid #555;background:rgba(0,0,0,0.4);color:#fff;font-size:14px}
.go{width:100%;padding:11px;border:none;border-radius:8px;background:#f59e0b;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
.kt{position:absolute;display:flex;flex-direction:column;align-items:center;animation:flt 28s linear forwards;z-index:5}
.tg{background:rgba(0,0,0,0.8);border:1px solid #ffd700;padding:3px 8px;border-radius:10px;font-size:11px;margin-bottom:2px;white-space:nowrap}
.tg b{color:#ffd700;display:block}
@keyframes flt{0%{left:-150px}100%{left:110vw}}
</style>
</head>
<body>
<audio id="bgAudio" src="song.mp3" loop preload="auto"></audio>
<div class="top">
<button class="pbtn" id="mBtn">🔇 เปิดเพลง</button>
<div class="sws">
<button class="bgo on" data-bg="">🌕 เดือนเพ็ญ</button>
<button class="bgo" data-bg="bg-fw">🎆 พลุ</button>
<button class="bgo" data-bg="bg-fr">🌿 หิ่งห้อย</button>
</div>
</div>
<div class="sky"><div class="moon"></div><div id="fx"></div></div>
<div class="box">
<h1>🌕 ออกแบบกระทงออนไลน์</h1>
<div class="status" id="dbStatus">🟡 พร้อมใช้งาน</div>
<div class="prev" id="pv"></div>
<span class="lbl">1. รูปแบบกระทง:</span>
<div class="row" id="typeRow">
<button class="bb on" data-t="banana">ใบตอง</button>
<button class="bb" data-t="lotus">กลีบบัว</button>
<button class="bb" data-t="coconut">กะลา</button>
<button class="bb" data-t="bread">ขนมปัง</button>
</div>
<span class="lbl">2. โทนสีกลีบ / วัสดุ:</span>
<div class="row" id="petalRow">
<div class="dot on" style="background:#4caf50" data-c="#4caf50"></div>
<div class="dot" style="background:#f48fb1" data-c="#f48fb1"></div>
<div class="dot" style="background:#ce93d8" data-c="#ce93d8"></div>
<div class="dot" style="background:#fff59d" data-c="#fff59d"></div>
<div class="dot" style="background:#ffffff" data-c="#ffffff"></div>
</div>
<span class="lbl">3. สีดอกไม้ & เทียน:</span>
<div class="row" id="flowerRow">
<div class="dot on" style="background:#ffeb3b" data-c="#ffeb3b"></div>
<div class="dot" style="background:#ff5252" data-c="#ff5252"></div>
<div class="dot" style="background:#ff9800" data-c="#ff9800"></div>
<div class="dot" style="background:#e040fb" data-c="#e040fb"></div>
<div class="dot" style="background:#00e5ff" data-c="#00e5ff"></div>
</div>
<input type="text" id="un" placeholder="ชื่อของคุณ (เช่น สมชาย)" maxlength="25">
<input type="text" id="uw" placeholder="คำอธิษฐาน (เช่น ขอให้มีความสุข)" maxlength="60">
<button class="go" id="goBtn">✨ ปล่อยกระทงลงน้ำ ✨</button>
</div>
<div class="river" id="rv"></div>

<script type="module">
import{initializeApp}from"https://gstatic.com";
import{getFirestore,collection,addDoc,onSnapshot,query,orderBy,limit,serverTimestamp}from"https://gstatic.com";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT_://firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_PROJECT_://appspot.com",
  messagingSenderId:"YOUR_SENDER_ID",
  appId:"YOUR_APP_ID"
};

let d={t:"banana",p:"#4caf50",f:"#ffeb3b"},pl=0,db=null;

function mkSvg(c,w){
  const t=c.t||"banana",p=c.p||"#4caf50",f=c.f||"#ffeb3b";
  const top='<ellipse cx="50" cy="10" rx="4" ry="7" fill="#ff9800"/><rect x="48" y="16" width="4" height="22" fill="'+f+'"/><line x1="43" y1="14" x2="46" y2="38" stroke="#a1887f" stroke-width="1.5"/><line x1="57" y1="14" x2="54" y2="38" stroke="#a1887f" stroke-width="1.5"/>';
  let b="";
  if(t==="lotus"){
    b='<path d="M12,48 Q15,28 32,36 Q25,52 12,48 Z" fill="'+p+'" stroke="#880e4f" stroke-width="0.8"/><path d="M88,48 Q85,28 68,36 Q75,52 88,48 Z" fill="'+p+'" stroke="#880e4f" stroke-width="0.8"/><path d="M22,52 Q28,22 44,34 Q38,54 22,52 Z" fill="'+p+'" stroke="#880e4f" stroke-width="0.8"/><path d="M78,52 Q72,22 56,34 Q62,54 78,52 Z" fill="'+p+'" stroke="#880e4f" stroke-width="0.8"/><path d="M36,54 Q50,18 64,54 Q50,62 36,54 Z" fill="'+p+'" stroke="#880e4f" stroke-width="0.8"/><path d="M16,50 Q50,76 84,50 Q50,62 16,50 Z" fill="#2e7d32"/><circle cx="50" cy="40" r="5" fill="'+f+'"/>';
  }else if(t==="coconut"){
    b='<polygon points="22,42 36,24 50,42" fill="'+p+'"/><polygon points="50,42 64,24 78,42" fill="'+p+'"/><circle cx="36" cy="39" r="4.5" fill="'+f+'"/><circle cx="50" cy="38" r="5" fill="'+f+'"/><circle cx="64" cy="39" r="4.5" fill="'+f+'"/><path d="M14,42 A36,30 0 0,0 86,42 Z" fill="#4e342e"/><path d="M22,50 Q50,58 78,50" stroke="#8d6e63" stroke-width="1.2" fill="none"/><circle cx="44" cy="54" r="2.2" fill="#261612"/><circle cx="56" cy="54" r="2.2" fill="#261612"/>';
  }else if(t==="bread"){
    b='<ellipse cx="50" cy="54" rx="36" ry="16" fill="#d4a373" stroke="#8d5524" stroke-width="2"/><circle cx="14" cy="52" r="7" fill="#e6ccb2" stroke="#8d5524" stroke-width="1.5"/><circle cx="12" cy="50" r="1.5" fill="#000"/><ellipse cx="28" cy="66" rx="6" ry="4" fill="#b08968"/><ellipse cx="72" cy="66" rx="6" ry="4" fill="#b08968"/><circle cx="36" cy="44" r="4.5" fill="'+p+'"/><circle cx="50" cy="42" r="5" fill="'+f+'"/><circle cx="64" cy="44" r="4.5" fill="'+p+'"/>';
  }else{
    b='<polygon points="15,44 28,24 41,44" fill="'+p+'"/><polygon points="37,44 50,21 63,44" fill="'+p+'"/><polygon points="59,44 72,24 85,44" fill="'+p+'"/><circle cx="28" cy="40" r="4" fill="'+f+'"/><circle cx="50" cy="39" r="5" fill="'+f+'"/><circle cx="72" cy="40" r="4" fill="'+f+'"/><path d="M12,44 L88,44 L76,70 Q50,76 24,70 Z" fill="#1b5e20"/>';
  }
  return '<svg width="'+w+'" height="'+(w*0.85)+'" viewBox="0 0 100 85">'+top+b+'</svg>';
}

function upPv(){document.getElementById("pv").innerHTML=mkSvg(d,88)}

function togM(force){
  const au=document.getElementById("bgAudio"),btn=document.getElementById("mBtn");
  if(pl&&!force){au.pause();pl=0;btn.innerHTML="🔇 เปิดเพลง";}
  else if(!pl){
    au.play().then(()=>{pl=1;btn.innerHTML="🔊 ปิดเพลง";})
    .catch(()=>{if(!force)alert("ไม่พบไฟล์ song.mp3 กรุณาอัปโหลดไฟล์ song.mp3 คู่กับ index.html ค่ะ");});
  }
}

function setBg(c,el){
  document.body.className=c;
  document.querySelectorAll(".bgo").forEach(x=>x.classList.remove("on"));
  if(el)el.classList.add("on");
  const fx=document.getElementById("fx");fx.innerHTML="";
  if(c===""){
    for(let i=0;i<9;i++){const l=document.createElement("div");l.className="lnt";l.style.cssText=`left:${Math.random()*90+5}%;bottom:10px;animation-duration:${Math.random()*5+7}s;animation-delay:${Math.random()*4}s`;fx.appendChild(l);}
  }else if(c==="bg-fw"){
